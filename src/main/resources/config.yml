# Economy plugin configuration.
# Prices live in prices.tsv (same folder) - edit it and run /eco reload.

# Balance new players start with.
starting-balance: 1000

# Highest balance (and highest single payment) allowed.
max-balance: 1000000000000000

# How often balances are written to disk (minutes). They are also saved on shutdown.
autosave-minutes: 5

auction:
  # How long a listing stays up before the item goes to the seller's /ah collect box.
  duration-hours: 48
  max-listings-per-player: 10
  # Percentage of the sale price removed from the economy when an auction sells.
  tax-percent: 5
  max-price: 1000000000000

  ai:
    # Synthetic listings make a small server feel busy. They are ordinary
    # auction listings with realistic gear, damage and enchantments.
    enabled: true
    # How many AI listings the engine tries to keep live. The AI market scales
    # its per-category stock so even 1000+ listings stay supplied.
    target-listings: 1000
    # Maximum new AI listings per 30 second market tick.
    max-new-per-tick: 50
    # How long AI listings last before they are recycled.
    duration-hours: 48
    # Base time between stock restocks (each category gets a random +/-40%).
    restock-minutes: 12
    # Change this for a different but repeatable item/price pattern.
    seed: 1337

    # Special relics are unique, very expensive listings with abilities such as
    # area mining, vein mining, tree felling, level 10-15 enchantments and
    # eternal armour with a random slot-bound potion effect.
    special-relics-enabled: true
    # Total number of relics the market may ever mint. Set 0 to disable.
    max-special-relics: 24
    # Chance that a newly minted relic is the extremely rare Keep Inventory Helmet.
    # 0.02 means 2 in 100 relics. Set 0 to make it unobtainable from the market.
    keep-inventory-helmet-chance: 0.02

    # AI buyers occasionally purchase listings created by players. They only buy
    # listings that are reasonably priced compared with the item's appraised value.
    buyers:
      enabled: true
      # Base chance per player listing on each 30 second market tick. Good deals
      # get a bonus and listings become more attractive as they age.
      chance-per-listing-per-tick: 0.03
      # Hard cap so a busy auction house cannot be bought out instantly.
      max-per-tick: 2
      # Give players time to advertise before an AI can buy the listing.
      min-age-minutes: 10
      # Ignore very cheap items and listings above this price.
      min-value: 1000
      max-price: 1000000000
      # Maximum price / appraised value. Listings priced above this are ignored.
      # 1.75 means the AI may overpay by up to 75% on a good day.
      max-value-ratio: 1.75

mystery:
  enabled: true
  # Crates available per tier before they sell out and need a restock.
  stock-per-tier: 8
  restock-minutes: 20
  # Scales the value of prizes without changing crate prices.
  payout-scale: 1.0
  # Multiply every crate price (0.5 = half price, 2.0 = double price).
  price-multiplier: 1.0
  broadcast-jackpots: true
  seed: 7331
