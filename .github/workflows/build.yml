name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create/update (leave empty for v<plugin version>)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build plugin
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon clean build --stacktrace

      - name: Verify plugin jar
        run: |
          set -euo pipefail
          ls -lh build/libs/*.jar
          test -n "$(find build/libs -maxdepth 1 -name '*.jar' -print -quit)"

      - name: Read plugin version
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n "s/^version = '\([^']*\)'/\1/p" build.gradle | head -n1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $version"

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: Economy-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built jar
        uses: actions/download-artifact@v4
        with:
          name: Economy-${{ github.sha }}
          path: release

      - name: Resolve release tag
        id: meta
        env:
          REQUESTED_TAG: ${{ github.event.inputs.release_tag }}
          PLUGIN_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-}"
          if [[ -z "$tag" && "$GITHUB_REF" == refs/tags/* ]]; then
              tag="$GITHUB_REF_NAME"
          fi
          if [[ -z "$tag" ]]; then
              tag="v${PLUGIN_VERSION}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Economy ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
          files: |
            release/*.jar
            docs/PRICE.md
            docs/GUI.md
